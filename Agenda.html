<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --panel:#17171A;
    --panel-alt:#1E1E22;
    --line:#2A2A2E;
    --text:#F2F1ED;
    --text-dim:#8B8B90;
    --accent:#E3A83B;
    --accent-dim:#5B4522;
    --teal:#57C7B0;
    --danger:#E2685A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1400px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px;
  }
  .title-block{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .title-block h1{
    font-family:'Fraunces',serif;font-weight:700;font-size:30px;margin:0;
    letter-spacing:.2px;
  }
  .week-range{color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  button, select{
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    background:var(--panel-alt);color:var(--text);
    border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  button:hover{background:#26262B;border-color:#3a3a40;}
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  .btn-today{background:var(--accent);color:#1a1200;border-color:var(--accent);}
  .btn-today:hover{background:#f0b750;}
  .nav-arrow{padding:8px 12px;font-size:15px;line-height:1;}
  select{-webkit-appearance:none;appearance:none;padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }

  /* ---------- Week grid ---------- */
  .week{
    display:flex;flex-wrap:wrap;gap:14px;
  }
  .day{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 12px 16px;position:relative;overflow:hidden;
    animation:fadeIn .25s ease;
    flex:1 1 380px;min-width:340px;max-width:480px;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
  .day::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);
  }
  .day.today::before{background:var(--accent);}
  .day-head{margin-bottom:10px;padding-left:6px;}
  .day-name{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;}
  .day.today .day-name{color:var(--accent);}
  .day-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}

  .day-body{display:flex;gap:12px;align-items:flex-start;}
  .hours{flex:1 1 60%;min-width:0;padding-left:6px;margin-bottom:0;}
  .todo-box{flex:1 1 40%;min-width:0;max-width:230px;}
  .hour-row{
    display:flex;align-items:flex-start;gap:7px;
    border-top:1px solid var(--line);padding:7px 0;
  }
  .hour-row:first-child{border-top:none;}
  .hour-row.now{background:linear-gradient(90deg, var(--accent-dim), transparent 65%);
    margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:4px;}
  .hour-check{
    appearance:none;-webkit-appearance:none;width:14px;height:14px;flex-shrink:0;margin-top:3px;
    border:1.5px solid var(--text-dim);border-radius:4px;background:transparent;cursor:pointer;position:relative;
    display:none;
  }
  body.show-hour-flags .hour-check{display:inline-block;}
  .hour-check:checked{background:var(--teal);border-color:var(--teal);}
  .hour-check:checked::after{
    content:"";position:absolute;left:3.5px;top:0.5px;width:3.5px;height:7px;
    border:solid #0B0B0D;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .hour-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    width:34px;flex-shrink:0;margin-top:3px;
  }
  .hour-input{
    flex:1;background:transparent;border:none;color:var(--text);
    font-family:'Inter',sans-serif;font-size:12.5px;padding:3px 4px;border-radius:4px;
    min-width:0;resize:none;overflow:hidden;line-height:1.4;min-height:34px;
    font-variant-ligatures:none;
  }
  .hour-input:hover{background:var(--panel-alt);}
  .hour-input:focus{background:var(--panel-alt);outline:none;}
  .hour-row.hour-done .hour-input{color:var(--text-dim);text-decoration:line-through;}

  .todo-box{
    background:var(--panel-alt);border:1px solid var(--line);border-radius:8px;padding:10px 10px 12px;
  }
  .todo-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
  .todo-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px;}
  .todo-item input[type=checkbox]{
    appearance:none;-webkit-appearance:none;width:15px;height:15px;flex-shrink:0;margin-top:2px;
    border:1.5px solid var(--text-dim);border-radius:4px;background:transparent;cursor:pointer;position:relative;
  }
  .todo-item input[type=checkbox]:checked{background:var(--teal);border-color:var(--teal);}
  .todo-item input[type=checkbox]:checked::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid #0B0B0D;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .todo-text{flex:1;font-size:12.5px;line-height:1.35;background:transparent;border:none;color:var(--text);
    font-family:'Inter',sans-serif;padding:2px;min-width:0;word-break:break-word;
    resize:none;overflow:hidden;min-height:18px;}
  .todo-text:hover{background:var(--panel);border-radius:4px;}
  .todo-text:focus{background:var(--panel);border-radius:4px;outline:none;}
  .todo-item.done .todo-text{color:var(--text-dim);text-decoration:line-through;}
  .todo-del{
    background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:0 2px;
    flex-shrink:0;line-height:1;
  }
  .todo-del:hover{color:var(--danger);}
  .todo-add{
    display:flex;gap:6px;margin-top:8px;
  }
  .todo-add input{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
    color:var(--text);font-size:12.5px;padding:6px 8px;font-family:'Inter',sans-serif;min-width:0;
  }
  .todo-add button{padding:6px 10px;font-size:13px;}

  /* ---------- Mobile: one day at a time ---------- */
  @media (max-width:820px){
    .week{gap:0;}
    .day{display:none;flex-basis:100%;max-width:100%;min-width:0;}
    .day.mobile-active{display:block;}
    .title-block h1{font-size:24px;}
    .app{padding:16px 14px 50px;}
  }
  @media (max-width:480px){
    .day-body{flex-direction:column;}
    .todo-box{max-width:100%;}
  }
  .mobile-day-nav{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  @media (max-width:820px){
    .mobile-day-nav{display:flex;}
  }
  .mobile-day-nav .label{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  footer{margin-top:26px;color:var(--text-dim);font-size:11.5px;text-align:center;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1 id="monthTitle">—</h1>
      <span class="week-range" id="weekRange"></span>
    </div>
    <div class="controls">
      <button id="toggleFlagsBtn" title="Mostra/nascondi le spunte sulle ore">Flag ore: nascosti</button>
      <select id="monthSelect" aria-label="Vai al mese"></select>
      <button class="nav-arrow" id="prevBtn" aria-label="Settimana precedente" title="Settimana precedente">‹</button>
      <button class="btn-today" id="todayBtn">OGGI</button>
      <button class="nav-arrow" id="nextBtn" aria-label="Settimana successiva" title="Settimana successiva">›</button>
    </div>
  </header>

  <div class="mobile-day-nav">
    <button id="prevDayMobile" class="nav-arrow" title="Giorno precedente">‹</button>
    <span class="label" id="mobileDayLabel">—</span>
    <button id="nextDayMobile" class="nav-arrow" title="Giorno successivo">›</button>
  </div>

  <div class="week" id="weekGrid"></div>

  <footer id="syncNotice">—</footer>
</div>

<script>
const HOURS = [];
for(let h=7; h<=22; h++) HOURS.push(String(h).padStart(2,'0')+':00');

const DAY_NAMES = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];
const MONTH_NAMES = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const YEARS = [2026, 2027];

let currentDate = new Date(); // giorno "a fuoco" (guida sia la settimana desktop che il giorno mobile)
let mobileIndex = 0; // 0..6, quale giorno della settimana e' mostrato su mobile
const dataCache = {}; // dateKey -> {hours:{}, tasks:[]}

function pad(n){return String(n).padStart(2,'0');}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function sameDay(a,b){return dateKey(a)===dateKey(b);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}

function getMonday(d){
  const day = d.getDay(); // 0=Dom
  const diff = day===0 ? -6 : 1-day;
  return addDays(d, diff);
}

function storageKey(d){return `day:${dateKey(d)}`;}

// Fallback: se l'app viene aperta come file scaricato fuori da Claude,
// window.storage potrebbe non esistere. In quel caso i dati restano solo
// su quel dispositivo/browser (nessuna sincronizzazione tra dispositivi).
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage;

async function storageGetSafe(key){
  if(hasCloudStorage){
    return await window.storage.get(key);
  }
  const raw = localStorage.getItem(key);
  return raw ? {key, value: raw} : null;
}
async function storageSetSafe(key, value){
  if(hasCloudStorage){
    return await window.storage.set(key, value);
  }
  localStorage.setItem(key, value);
  return {key, value};
}

async function loadDay(d){
  const key = dateKey(d);
  if(dataCache[key]) return dataCache[key];
  let val = {hours:{}, tasks:[]};
  try{
    const res = await storageGetSafe(storageKey(d));
    if(res && res.value){ val = JSON.parse(res.value); }
  }catch(e){ /* nessun dato salvato ancora */ }
  if(!val.hours) val.hours = {};
  if(!val.tasks) val.tasks = [];
  // migrazione: vecchie voci orarie salvate come semplice testo
  Object.keys(val.hours).forEach(h=>{
    if(typeof val.hours[h] === 'string'){
      val.hours[h] = {text: val.hours[h], done:false};
    }
  });
  dataCache[key] = val;
  return val;
}

async function saveDay(d){
  const key = dateKey(d);
  const val = dataCache[key];
  if(!val) return;
  try{
    await storageSetSafe(storageKey(d), JSON.stringify(val));
  }catch(e){ console.error('Errore salvataggio', e); }
}

function isMobile(){ return window.innerWidth <= 820; }

function currentWeekDates(){
  const monday = getMonday(currentDate);
  const arr = [];
  for(let i=0;i<7;i++) arr.push(addDays(monday,i));
  return arr;
}

function updateHeaderTitle(weekDates){
  const first = weekDates[0], last = weekDates[6];
  let title;
  if(first.getMonth() === last.getMonth()){
    title = `${MONTH_NAMES[first.getMonth()]} ${first.getFullYear()}`;
  } else {
    title = `${MONTH_NAMES[first.getMonth()]} / ${MONTH_NAMES[last.getMonth()]} ${last.getFullYear()}`;
  }
  document.getElementById('monthTitle').textContent = title;
  document.getElementById('weekRange').textContent =
    `${pad(first.getDate())}/${pad(first.getMonth()+1)} - ${pad(last.getDate())}/${pad(last.getMonth()+1)}/${last.getFullYear()}`;
}

function populateMonthSelect(){
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  YEARS.forEach(y=>{
    MONTH_NAMES.forEach((name, i)=>{
      const opt = document.createElement('option');
      opt.value = `${y}-${i}`;
      opt.textContent = name + ' ' + y;
      sel.appendChild(opt);
    });
  });
  sel.value = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;
  sel.addEventListener('change', ()=>{
    const [y, m] = sel.value.split('-').map(Number);
    currentDate = new Date(y, m, 1);
    render();
  });
}

function dayCardHTML(d, todayFlag){
  const key = dateKey(d);
  return `
  <div class="day ${todayFlag?'today':''}" data-key="${key}">
    <div class="day-head">
      <div class="day-name">${DAY_NAMES[d.getDay()]}</div>
      <div class="day-date">${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}</div>
    </div>
    <div class="day-body">
      <div class="hours" data-hours="${key}"></div>
      <div class="todo-box" data-todo="${key}">
        <div class="todo-title">Cose da fare</div>
        <div class="todo-list" data-list="${key}"></div>
        <div class="todo-add">
          <input type="text" placeholder="Aggiungi..." data-add-input="${key}">
          <button data-add-btn="${key}">+</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderHours(container, d, val){
  const now = new Date();
  const nowHour = now.getHours();
  const isToday = sameDay(d, now);
  container.innerHTML = HOURS.map(h=>{
    const hh = parseInt(h.slice(0,2),10);
    const isNow = isToday && hh === nowHour;
    const entry = val.hours[h] || {text:'', done:false};
    const text = entry.text || '';
    return `<div class="hour-row ${isNow?'now':''} ${entry.done?'hour-done':''}">
      <input type="checkbox" class="hour-check" data-hour-check="${h}" ${entry.done?'checked':''}>
      <span class="hour-label">${h}</span>
      <textarea class="hour-input" rows="1" data-hour-input="${h}" placeholder="">${text.replace(/</g,'&lt;')}</textarea>
    </div>`;
  }).join('');
  container.querySelectorAll('.hour-input').forEach(ta=>autoGrow(ta));
}

function autoGrow(ta, minH){
  minH = minH || 34;
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, minH) + 'px';
}

function renderTodos(container, d, val){
  container.innerHTML = val.tasks.map(t=>`
    <div class="todo-item ${t.done?'done':''}" data-task-id="${t.id}">
      <input type="checkbox" ${t.done?'checked':''} data-task-check="${t.id}">
      <textarea class="todo-text" rows="1" data-task-text="${t.id}">${(t.text||'').replace(/</g,'&lt;')}</textarea>
      <button class="todo-del" data-task-del="${t.id}" aria-label="Elimina">×</button>
    </div>
  `).join('');
  container.querySelectorAll('.todo-text').forEach(ta=>autoGrow(ta, 18));
}

async function hydrateDay(d){
  const key = dateKey(d);
  const val = await loadDay(d);
  const hoursEl = document.querySelector(`[data-hours="${key}"]`);
  const listEl = document.querySelector(`[data-list="${key}"]`);
  if(hoursEl) renderHours(hoursEl, d, val);
  if(listEl) renderTodos(listEl, d, val);
}

function attachDayEvents(d){
  const key = dateKey(d);
  const card = document.querySelector(`.day[data-key="${key}"]`);
  if(!card) return;

  card.querySelectorAll('[data-hour-input]').forEach(ta=>{
    ta.addEventListener('input', ()=>autoGrow(ta));
    ta.addEventListener('change', async ()=>{
      const val = await loadDay(d);
      const h = ta.dataset.hourInput;
      if(!val.hours[h]) val.hours[h] = {text:'', done:false};
      val.hours[h].text = ta.value;
      saveDay(d);
    });
  });

  card.querySelectorAll('[data-hour-check]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const val = await loadDay(d);
      const h = cb.dataset.hourCheck;
      if(!val.hours[h]) val.hours[h] = {text:'', done:false};
      val.hours[h].done = cb.checked;
      saveDay(d);
      const row = cb.closest('.hour-row');
      if(row) row.classList.toggle('hour-done', cb.checked);
    });
  });

  card.querySelectorAll('[data-task-check]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const val = await loadDay(d);
      const t = val.tasks.find(x=>String(x.id)===cb.dataset.taskCheck);
      if(t){ t.done = cb.checked; saveDay(d); }
      const item = cb.closest('.todo-item');
      if(item) item.classList.toggle('done', cb.checked);
    });
  });

  card.querySelectorAll('[data-task-text]').forEach(inp=>{
    inp.addEventListener('input', ()=>autoGrow(inp, 18));
    inp.addEventListener('change', async ()=>{
      const val = await loadDay(d);
      const t = val.tasks.find(x=>String(x.id)===inp.dataset.taskText);
      if(t){ t.text = inp.value; saveDay(d); }
    });
  });

  card.querySelectorAll('[data-task-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const val = await loadDay(d);
      val.tasks = val.tasks.filter(x=>String(x.id)!==btn.dataset.taskDel);
      saveDay(d);
      hydrateDay(d).then(()=>attachDayEvents(d));
    });
  });

  const addInput = card.querySelector(`[data-add-input="${key}"]`);
  const addBtn = card.querySelector(`[data-add-btn="${key}"]`);
  async function addTask(){
    const text = addInput.value.trim();
    if(!text) return;
    const val = await loadDay(d);
    val.tasks.push({id: Date.now()+Math.random().toString(16).slice(2), text, done:false});
    addInput.value = '';
    saveDay(d);
    hydrateDay(d).then(()=>attachDayEvents(d));
  }
  addBtn.addEventListener('click', addTask);
  addInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });
}

async function render(){
  const weekDates = currentWeekDates();
  updateHeaderTitle(weekDates);
  document.getElementById('monthSelect').value = `${currentDate.getFullYear()}-${currentDate.getMonth()}`;

  const grid = document.getElementById('weekGrid');
  const now = new Date();
  grid.innerHTML = weekDates.map(d=>dayCardHTML(d, sameDay(d, now))).join('');

  for(const d of weekDates){
    await hydrateDay(d);
    attachDayEvents(d);
  }

  applyMobileVisibility(weekDates);
}

function applyMobileVisibility(weekDates){
  if(!weekDates) weekDates = currentWeekDates();
  const cards = document.querySelectorAll('.day');
  const activeIdx = weekDates.findIndex(d=>sameDay(d, currentDate));
  cards.forEach((c,i)=>{
    c.classList.toggle('mobile-active', i===activeIdx);
  });
  const activeDate = weekDates[activeIdx] || currentDate;
  document.getElementById('mobileDayLabel').textContent =
    `${DAY_NAMES[activeDate.getDay()]} ${pad(activeDate.getDate())}/${pad(activeDate.getMonth()+1)}`;
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  currentDate = addDays(currentDate, -7);
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  currentDate = addDays(currentDate, 7);
  render();
});
document.getElementById('prevDayMobile').addEventListener('click', ()=>{
  currentDate = addDays(currentDate, -1);
  render();
});
document.getElementById('nextDayMobile').addEventListener('click', ()=>{
  currentDate = addDays(currentDate, 1);
  render();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentDate = new Date();
  render();
});

window.addEventListener('resize', ()=>applyMobileVisibility());

populateMonthSelect();
render();
initHourFlagsToggle();

document.getElementById('syncNotice').textContent = hasCloudStorage
  ? 'I dati si salvano e si sincronizzano automaticamente sul tuo account Claude, su ogni dispositivo dove apri questo planner da Claude.'
  : 'Attenzione: questo file e\' aperto fuori da Claude, quindi i dati restano salvati solo su questo dispositivo/browser e non si sincronizzano con altri.';

async function initHourFlagsToggle(){
  const btn = document.getElementById('toggleFlagsBtn');
  let visible = false;
  try{
    const res = await storageGetSafe('settings:hourFlagsVisible');
    if(res && res.value === 'true') visible = true;
  }catch(e){}
  applyHourFlagsVisibility(visible);
  btn.addEventListener('click', async ()=>{
    visible = !visible;
    applyHourFlagsVisibility(visible);
    try{ await storageSetSafe('settings:hourFlagsVisible', String(visible)); }catch(e){}
  });
}

function applyHourFlagsVisibility(visible){
  document.body.classList.toggle('show-hour-flags', visible);
  document.getElementById('toggleFlagsBtn').textContent = visible ? 'Flag ore: visibili' : 'Flag ore: nascosti';
}
</script>
</body>
</html>
