<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="./manifest-v10.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./agenda-icon-180-v10.png">
<title>Planner</title>
<style>
html,body{margin:0;min-height:100%;background:#0B0B0D;color:#F2F1ED;font-family:system-ui,sans-serif}
.loader{min-height:100vh;display:grid;place-items:center;color:#8B8B90;font-size:13px}
</style>
</head>
<body>
<div class="loader" id="loader">Apertura Planner…</div>
<script>
(async function(){
  try{
    const response = await fetch('./Agenda.html?v=25',{cache:'no-store'});
    if(!response.ok) throw new Error('Agenda.html non disponibile');

    let html = await response.text();

    const cssTag =
      '<link rel="stylesheet" href="./planner-v25.css?v=25">';
    const scriptTag =
      '<scr' + 'ipt src="./planner-v25.js?v=25"></scr' + 'ipt>';

    html = html.replace('</head>',cssTag + '\n</head>');
    html = html.replace('</body>',scriptTag + '\n</body>');

    document.open();
    document.write(html);
    document.close();

  }catch(error){
    console.error('Errore apertura Planner V25',error);
    const loader=document.getElementById('loader');
    if(loader){
      loader.textContent =
        'Impossibile aprire il Planner. Ricarica la pagina con Internet attivo.';
    }
  }
})();
</script>
</body>
</html>
